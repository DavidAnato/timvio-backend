version: "3.9"

services:
  api:
    build:
      context: ./api          # dossier de votre app Express
      dockerfile: Dockerfile
    container_name: express-api
    restart: unless-stopped
    env_file: .env            # variables (PORT, DB_URI, NODE_ENV…)
    networks: [ backend ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      retries: 3
      start_period: 10s

  nginx:
    build:
      context: ./nginx
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"          # décommentez si vous gérez le TLS ici
    depends_on:
      api:
        condition: service_started
    networks: [ backend ]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost || exit 1"]
      interval: 30s
      retries: 3

networks:
  backend:

volumes:
  mongo_data: