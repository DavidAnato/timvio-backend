version: "3.9"

services:
  api:
    build:
      context: .              
      dockerfile: Dockerfile
    container_name: express-api
    restart: unless-stopped
    env_file: .env            
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - backend
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persistance des certificats et configuration
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://api:3000/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

networks:
  backend:

volumes:
  caddy_data:
  caddy_config: